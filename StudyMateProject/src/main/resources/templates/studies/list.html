<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>스터디 목록</title>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<h1>스터디 목록</h1>

<p><a href="/studies/new">+ 스터디 만들기</a></p>

<form action="/studies" method="get" th:object="${cond}">
    <select th:field="*{type}">
        <option value="all">제목+설명</option>
        <option value="title">제목</option>
        <option value="description">설명</option>
    </select>

    <input type="text" th:field="*{keyword}" placeholder="검색어를 입력하세요">

    <select th:field="*{size}">
        <option value="all">모집 인원 전체</option>
        <option value="small">2~4명</option>
        <option value="medium">5~10명</option>
        <option value="large">11명 이상</option>
    </select>

    <button type="submit">검색</button>
</form>
<p th:if="${#lists.isEmpty(studies) and cond.searching}">검색 결과가 없습니다.</p>
<p th:if="${#lists.isEmpty(studies) and !cond.searching}">아직 등록된 스터디가 없습니다.</p>

<table th:unless="${#lists.isEmpty(studies)}" border="1" cellpadding="6">
    <thead>
    <tr>
        <th>제목</th>
        <th>모집 인원</th>
        <th>개설자</th>
        <th>생성일</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="study : ${studies}">
        <td><a th:href="@{/studies/{id}(id=${study.id})}" th:text="${study.title}"></a></td>
        <td th:text="${study.maxMembers} + '명'"></td>
        <td th:text="${study.leader.name}"></td>
        <td th:text="${#temporals.format(study.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
