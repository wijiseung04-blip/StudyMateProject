<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>스터디 목록</title>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<h1>스터디 목록</h1>

<p><a href="/studies/new">+ 스터디 만들기</a></p>

<p th:if="${#lists.isEmpty(studies)}">아직 등록된 스터디가 없습니다.</p>

<table th:unless="${#lists.isEmpty(studies)}" border="1" cellpadding="6">
    <thead>
    <tr>
        <th>제목</th>
        <th>모집 인원</th>
        <th>개설자</th>
        <th>생성일</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="study : ${studies}">
        <td><a th:href="@{/studies/{id}(id=${study.id})}" th:text="${study.title}"></a></td>
        <td th:text="${study.maxMembers} + '명'"></td>
        <td th:text="${study.leader.name}"></td>
        <td th:text="${#temporals.format(study.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
